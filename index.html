<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>buscador-usuarios</title>
  </head>
  <body>
    <main>
      <div class="container">
        <h1>Buscador de usuários do GitHub</h1>
        <div class="input-container">
          <form id="usernameForm">
            <input placeholder = "nome-de-usuario" type="text" id="usernameInput">           
            <button><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 21L16.66 16.66M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" stroke="#979797" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></button>
          </svg>       
          </form>
      
        </div>
        <div class="user" id="userCard">
            <img class="profile-picture" id="profilePicture" src="src/assets/github-logo.png">
            <h4 class="username" id="username">@github</h4>
            <div class="info" id="infoDiv">
              <p>Nome: GitHub</p>
              <p>Localização: San Francisco, CA</p>
              <p>Insituição: GitHub</p>
              <p>Repositórios públicos: 528</p>
              <p>Seguidores: 64.759</p>
              <a href="">Ir para a conta</a>
            </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
